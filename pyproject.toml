[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Institutional Stock Analysis System — Python CLI for fundamental equity research"
requires-python = ">=3.9"
authors = [{ name = "Rahul" }]
dependencies = [
    "requests>=2.28.0",
    "yfinance>=0.2.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
stock-analyzer = "stock_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stock_analyzer*"]

[tool.ruff]
line-length = 100
target-version = "py39"